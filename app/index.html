<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pedro Agent</title>
  <meta name="description" content="Grava reuniões, transcreve localmente e gera atas com IA.">
  <meta name="theme-color" content="#0e3b43">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <nav class="side" aria-label="Navegação principal">
      <div class="logo">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#d9822b"/><path d="M18 46V18h15a10 10 0 0 1 0 20h-7" fill="none" stroke="#0e3b43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="44" cy="44" r="5" fill="#0e3b43"/></svg>
        <div>Pedro Agent<small>atas de reunião</small></div>
      </div>
      <button class="nav" data-route="inicio">● Nova reunião</button>
      <button class="nav" data-route="reunioes">☰ Reuniões</button>
      <button class="nav" data-route="memoria">✎ Correções</button>
      <button class="nav" data-route="config">⚙ Configurações</button>
      <button class="nav" data-route="ajuda">? Ajuda</button>
      <div class="foot" id="foot"></div>
    </nav>
    <main id="view" tabindex="-1"><p class="muted">Carregando…</p></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="dlg"></dialog>
  <noscript>O Pedro Agent precisa de JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
